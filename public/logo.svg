<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="navigium-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#navigium-grad)" />
  <rect x="4" y="4" width="92" height="92" rx="24" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Compass / star lines in background -->
  <circle cx="50" cy="50" r="34" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M50 12 L50 20 M50 80 L50 88 M12 50 L20 50 M80 50 L88 50" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />

  <!-- Stylized modern nautical 'N' -->
  <path d="M33 70 V30 L67 70 V30" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Star sparkle accent -->
  <path d="M68 23 L70 28 L75 30 L70 32 L68 37 L66 32 L61 30 L66 28 Z" fill="url(#gold-grad)" filter="url(#glow)" />
</svg>
